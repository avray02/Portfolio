<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="Alexandre VRAY, athletic performances, triathlon, cycling, running" />
    <meta name="description" content="Complete record of athletic performances and achievements" />
    <link rel="stylesheet" href="./style.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" integrity="sha512-iBBXm8fW90+nuLcSKlbmrPcLa0OT92xO1BIsZ+ywDWZCvqsWgccV3gFoRBv0z+8dLJgyAHIhR35VZc2oM/gI1w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link id='favicon' rel="shortcut icon" href="../assets/images/logo/white.png" type="image/x-png">
    <title>Athletic Performances | A.Vray</title>
</head>
<body oncontextmenu="return false">

<!-- navbar starts -->
<header>
    <a href="../personal-page/index.html" class="logo">
        <img src="../assets/images/logo/black.png" alt="Logo" class="default-logo">
        <img src="../assets/images/logo/color.png" alt="Logo" class="color-logo"> Alexandre
    </a>

    <div id="menu" class="fas fa-bars"></div>
    <nav class="navbar">
        <ul>
            <li><a href="../personal-page/index.html#home">Home</a></li>
            <li><a href="../personal-page/index.html#about">About</a></li>
            <li><a class="active" href="../personal-page/index.html#athletic">Athletic</a></li>
            <li><a href="../personal-page/index.html#community">Community</a></li>
            <li><a href="../personal-page/index.html#discovery">Discovery</a></li>
        </ul>
    </nav>
</header>
<!-- navbar ends -->

<!-- athletic performances section starts -->
<section class="performances" id="performances">
    <h2 class="heading"><i class="fas fa-medal"></i> Athletic <span>Performances</span></h2>
    
    <div class="quote">
        <span>"Success is the sum of small efforts repeated day in and day out."</span>
    </div>

    <!-- Filter buttons -->
    <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">
            <i class="fas fa-th"></i> All
        </button>
        <button class="filter-btn" data-filter="cycling">
            <i class="fas fa-bicycle"></i> Cycling
        </button>
        <button class="filter-btn" data-filter="running">
            <i class="fas fa-running"></i> Running
        </button>
        <button class="filter-btn" data-filter="trail">
            <i class="fas fa-mountain"></i> Trail
        </button>
        <button class="filter-btn" data-filter="skiing">
            <i class="fas fa-skiing"></i> Cross-Country Skiing
        </button>
        <button class="filter-btn" data-filter="triathlon">
            <i class="fas fa-swimmer"></i>
            <i class="fas fa-bicycle"></i>
            <i class="fas fa-running"></i>
            Triathlon
            <!-- <i class="fas fa-swimmer"></i> Triathlon -->
        </button>
    </div>

    <!-- Timeline -->
    <div class="timeline-container">
        <!-- Timeline will be loaded dynamically from performances.json -->
        <div style="text-align: center; width: 100%; padding: 5rem; color: #fff;">
            <i class="fas fa-spinner fa-spin" style="font-size: 5rem; color: #fc8c05;"></i>
            <p style="font-size: 2rem; margin-top: 2rem;">Loading performances...</p>
        </div>
    </div>

    <!-- Back button -->
    <div class="back-container">
        <a href="../personal-page/index.html#athletic" class="btn">
            <i class="fas fa-arrow-left"></i> Back to Personal Page
        </a>
    </div>

</section>
<!-- athletic performances section ends -->

<!-- footer section starts -->
<!-- Footer will be dynamically injected by footer.js -->
<!-- footer section ends -->

<!-- scroll top btn -->
<a href="#performances" class="fas fa-angle-up" id="scroll-top"></a>

<!-- ==== ALL MAJOR JAVASCRIPT CDNS STARTS ==== -->

<!-- ==== ALL MAJOR JAVASCRIPT CDNS ENDS ==== -->

<script src="../assets/js/components/personal-footer.js"></script>
<script src="./script.js"></script>

</body>
</html>
